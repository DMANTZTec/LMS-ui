server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html/lms;
    index  index.html;

    # React SPA — fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
